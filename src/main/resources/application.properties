# ===================================

# APPLICATION CONFIGURATION

# ===================================

spring.application.name=online-document-storer
server.port=8080
server.servlet.context-path=/

# ===================================

# DATABASE CONFIGURATION (MySQL)

# ===================================

spring.datasource.url=jdbc:mysql://localhost:3306/document_storer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================

# JPA / HIBERNATE

# ===================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================

# FILE STORAGE

# ===================================

app.file.upload-dir=./uploads
app.file.max-size=52428800
app.file.allowed-types=pdf,docx,doc,xlsx,xls,pptx,ppt,txt,jpg,jpeg,png,gif,zip,rar

# ===================================

# JWT CONFIGURATION

# ===================================

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===================================

# MULTIPART FILE UPLOAD

# ===================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===================================

# THYMELEAF

# ===================================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===================================

# LOGGING

# ===================================

logging.level.com.docstorer=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================

# SPRINGDOC / SWAGGER

# ===================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================

# ENCRYPTION

# ===================================

app.encryption.key=${ENCRYPTION_KEY:}
app.encryption.enabled=true

# ===================================

# CORS

# ===================================

app.cors.allowed-origins=[http://localhost:3000,http://localhost:8080](http://localhost:3000,http://localhost:8080)
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.max-age=3600

# ===================================

# ADMIN DEFAULT CREDENTIALS

# ===================================

app.admin.email=[admin@docstorer.com](mailto:admin@docstorer.com)
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=System Administrator
