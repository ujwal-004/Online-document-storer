<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DocStorer — Profile</title>
<link rel="stylesheet" href="/css/styles.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo"><i class="fa-solid fa-vault"></i><span>DocStorer</span><button class="sidebar-close" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button></div>
  <nav class="sidebar-nav">
    <a href="/dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
    <a href="/documents.html" class="nav-item"><i class="fa-solid fa-file-alt"></i><span>My Documents</span></a>
    <a href="/upload.html" class="nav-item"><i class="fa-solid fa-upload"></i><span>Upload</span></a>
    <a href="/search.html" class="nav-item"><i class="fa-solid fa-search"></i><span>Search</span></a>
    <a href="/profile.html" class="nav-item active"><i class="fa-solid fa-user-gear"></i><span>Profile</span></a>
    <div class="nav-separator"></div>
    <a href="#" class="nav-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
  </nav>
</div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="main-content" id="mainContent">
  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
    <div class="topbar-actions" style="margin-left:auto">
      <button class="icon-btn" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
      <div class="avatar-menu" onclick="toggleAvatarMenu()"><div class="avatar" id="topAvatar">?</div><div class="avatar-dropdown" id="avatarDropdown"><a href="/profile.html"><i class="fa-solid fa-user"></i> Profile</a><hr/><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></div></div>
    </div>
  </header>
  <div class="page-body">
    <div class="page-header"><div><h1 class="page-title">Profile & Settings</h1><p class="page-subtitle">Manage your account</p></div></div>
    <div class="profile-layout">
      <!-- Profile Card -->
      <div class="card profile-card">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="profileAvatar">?</div>
          <button class="avatar-upload-btn" onclick="document.getElementById('avatarInput').click()"><i class="fa-solid fa-camera"></i></button>
          <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)"/>
        </div>
        <h2 id="profileName">Loading...</h2>
        <p id="profileEmail" class="profile-email"></p>
        <span id="profileRole" class="role-badge"></span>
        <div class="profile-stats">
          <div><strong id="pStatDocs">—</strong><span>Documents</span></div>
          <div><strong id="pStatStorage">—</strong><span>Used</span></div>
          <div><strong id="pStatJoined">—</strong><span>Joined</span></div>
        </div>
      </div>
      <!-- Settings Tabs -->
      <div class="card settings-card">
        <div class="settings-tabs">
          <button class="stab active" onclick="showTab('tabInfo', this)"><i class="fa-solid fa-user"></i> Info</button>
          <button class="stab" onclick="showTab('tabSecurity', this)"><i class="fa-solid fa-shield"></i> Security</button>
          <button class="stab" onclick="showTab('tabPrefs', this)"><i class="fa-solid fa-sliders"></i> Preferences</button>
        </div>
        <!-- Info Tab -->
        <div id="tabInfo" class="tab-content active">
          <div id="profileAlert" class="alert hidden"></div>
          <div class="form-row-2">
            <div class="form-group"><label>First Name</label><input type="text" id="editFirstName"/></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="editLastName"/></div>
          </div>
          <div class="form-group"><label>Phone Number</label><input type="text" id="editPhone" placeholder="+1 555 000 0000"/></div>
          <div class="form-group"><label>Username</label><input type="text" id="editUsername" disabled class="input-disabled"/></div>
          <div class="form-group"><label>Email</label><input type="email" id="editEmail" disabled class="input-disabled"/></div>
          <button class="btn-primary" onclick="saveProfile()"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        </div>
        <!-- Security Tab -->
        <div id="tabSecurity" class="tab-content">
          <div id="securityAlert" class="alert hidden"></div>
          <div class="form-group"><label>Current Password</label><input type="password" id="oldPassword" placeholder="••••••••"/></div>
          <div class="form-group"><label>New Password</label><input type="password" id="newPassword" placeholder="••••••••"/></div>
          <div class="form-group"><label>Confirm New Password</label><input type="password" id="confirmNewPassword" placeholder="••••••••"/></div>
          <button class="btn-primary" onclick="changePassword()"><i class="fa-solid fa-key"></i> Update Password</button>
        </div>
        <!-- Preferences Tab -->
        <div id="tabPrefs" class="tab-content">
          <div class="pref-item">
            <div><strong>Dark Mode</strong><p>Switch between light and dark interface</p></div>
            <label class="toggle"><input type="checkbox" id="darkModeToggle" onchange="saveDarkMode(this)"/><span class="toggle-slider"></span></label>
          </div>
          <div class="pref-item">
            <div><strong>Default View</strong><p>How documents are displayed</p></div>
            <select class="select-input" id="defaultView" onchange="saveViewPref(this.value)">
              <option value="grid">Grid View</option>
              <option value="list">List View</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
